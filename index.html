<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIMIC AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #e3e3e3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .chat-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #000000;
        }
        .chat-header {
            padding: 18px 24px;
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
            background-color: #000000;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }
        .chat-header::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #34a853;
            border-radius: 50%;
        }
        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 32px;
            background-color: #000000;
        }
        .message-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-wrapper.user {
            align-items: flex-end;
        }
        .message-wrapper.ai {
            align-items: flex-start;
        }
        .sender-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: 0.3px;
        }
        .message {
            max-width: 85%;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-line;
        }
        .user .message {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 20px 20px 4px 20px;
            border: 1px solid #262626;
        }
        .ai .message {
            background-color: transparent;
            color: #e3e3e3;
            padding: 0;
            border-radius: 0;
        }
        .input-container {
            padding: 16px 24px 24px 24px;
            background-color: #000000;
        }
        .input-wrapper {
            display: flex;
            background-color: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 28px;
            padding: 4px 8px 4px 20px;
            align-items: center;
            min-height: 52px;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: #404040;
            background-color: #111111;
        }
        input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            padding: 10px 0;
            outline: none;
        }
        input::placeholder {
            color: #666666;
        }
        button {
            background: transparent;
            border: none;
            color: #ffffff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
            flex-shrink: 0;
        }
        button:active {
            background-color: #1a1a1a;
        }
        button svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">MIMIC v1.0</div>
        
        <div class="chat-box" id="chatBox">
            <div class="message-wrapper ai">
                <div class="sender-name">MIMIC AI</div>
                <div class="message">Hello! I am MIMIC, your AI companion. How can I help you build or create today?</div>
            </div>
        </div>
        
        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Ask MIMIC..." autocomplete="off">
                <button onclick="sendMessage()">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();
            
            if (text === '') return;

            // User Message Template
            const userWrapper = document.createElement('div');
            userWrapper.className = 'message-wrapper user';
            userWrapper.innerHTML = `
                <div class="sender-name">You</div>
                <div class="message"></div>
            `;
            userWrapper.querySelector('.message').innerText = text;
            chatBox.appendChild(userWrapper);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // AI Response Template
            setTimeout(() => {
                const aiWrapper = document.createElement('div');
                aiWrapper.className = 'message-wrapper ai';
                
                let response = "I've processed your prompt. Currently, my responses are running inside a standalone interface matrix.";
                const lowerText = text.toLowerCase();
                
                if (lowerText.includes('hello') || lowerText.includes('hi')) {
                    response = "Hi there! I'm online and ready to assist you.";
                } else if (lowerText.includes('who made you')) {
                    response = "I was deployed into reality by Laxmi Kanwar Rathore.";
                } else if (lowerText.includes('status')) {
                    response = "System Core: Operational\nMemory Grid: Active\nEnvironment: GitHub Pages Stable.";
                }
                
                aiWrapper.innerHTML = `
                    <div class="sender-name">MIMIC AI</div>
                    <div class="message"></div>
                `;
                aiWrapper.querySelector('.message').innerText = response;
                chatBox.appendChild(aiWrapper);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 650);
        }

        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
