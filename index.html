<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIMIC AI Core</title>
    <style>
        body {
            background-color: #0d0e12;
            color: #f5f7fa;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 500px;
            border: 2px solid #00f2fe;
            box-shadow: 0 0 15px #00f2fe;
            border-radius: 8px;
            background: #13161c;
            overflow: hidden;
        }
        .header {
            background: #00f2fe;
            color: #0d0e12;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
        }
        .chat-box {
            height: 300px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid #222230;
        }
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
        }
        .user-msg {
            background: #222230;
            color: #f5f7fa;
            align-self: flex-end;
            border: 1px solid #8a8a9e;
        }
        .ai-msg {
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            align-self: flex-start;
            border: 1px solid #00f2fe;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background: #0d0e12;
        }
        input {
            flex: 1;
            background: #13161c;
            border: 1px solid #222230;
            color: #f5f7fa;
            padding: 10px;
            border-radius: 4px;
            outline: none;
        }
        input:focus {
            border-color: #00f2fe;
        }
        button {
            background: #00f2fe;
            color: #0d0e12;
            border: none;
            padding: 0 15px;
            margin-left: 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">⚡ MIMIC AI CORE V1.0 ⚡</div>
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">MIMIC Core Active. Three-Dimensional Intellect online. Ask me anything.</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type a command or question...">
            <button onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();
            
            if (text === '') return;

            // User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = text;
            chatBox.appendChild(userDiv);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Simulated AI Response logic
            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-msg';
                
                let response = "Analyzing data stream... Command not recognized in basic shell matrix.";
                
                // Custom quick-responses you can play with!
                const lowerText = text.toLowerCase();
                if (lowerText.includes('hello') || lowerText.includes('hi')) {
                    response = "Greetings. I am MIMIC AI, your localized 3D Intellect engine.";
                } else if (lowerText.includes('who made you')) {
                    response = "I was deployed into reality by Laxmi Kanwar Rathore.";
                } else if (lowerText.includes('status')) {
                    response = "All systems operational. Memory grids stable. Core core temperatures optimal.";
                }
                
                aiDiv.innerText = response;
                chatBox.appendChild(aiDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }

        // Allow pressing Enter key to send
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
